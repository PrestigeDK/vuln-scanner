[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-scanner"
version = "1.0.0"
description = "Async Port & Vulnerability Scanner for CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]

[project.scripts]
vulnscanner = "src.cli:app"
